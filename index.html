<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taman Bunga Merah - Siram Manual</title>
<style>
*,
*::after,
*::before {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

:root {
  --dark-color: #4a934a;
}

body {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  min-height: 100vh;
  background-color: var(--dark-color);
  overflow: hidden;
  perspective: 1000px;
}

.night {
  position: fixed;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: 100%;
  height: 100%;
  background-image: radial-gradient(circle at 82% 14%, #fff6c8 0%, #ffe27a 6%, rgba(255, 226, 122, 0.35) 13%, transparent 22%), linear-gradient(to bottom, #8ec9f8 0%, #bfe6ff 30%, #eaf7d6 60%, var(--dark-color) 90%);
}

.night::before,
.night::after {
  content: "";
  position: absolute;
  background: #fff;
  border-radius: 50%;
  opacity: 0.9;
  box-shadow: 40px 10px 0 -6px #fff, 75px 4px 0 -10px #fff;
  animation: cloud-drift 40s linear infinite;
}

.night::before {
  top: 12%;
  left: -20%;
  width: 60px;
  height: 24px;
}

.night::after {
  top: 22%;
  left: -50%;
  width: 46px;
  height: 18px;
  animation-duration: 55s;
  animation-delay: -20s;
}

@keyframes cloud-drift {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(160vw);
  }
}
.flowers {
  position: relative;
  transform: scale(0.9);
}

.flower {
  position: absolute;
  bottom: 10vmin;
  transform-origin: bottom center;
  z-index: 10;
  --fl-speed: 0.8s;
}
.flower--1 {
  animation: moving-flower-1 4s linear infinite;
}
.flower--1 .flower__leaf {
  background-color: #ff5252;
  background-image: linear-gradient(to top, #b71c1c, #ff8a80);
}
.flower--1 .flower__line {
  height: 70vmin;
  animation-delay: 0.3s;
}
.flower--1 .flower__line__leaf--1 {
  animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
}
.flower--1 .flower__line__leaf--2 {
  animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
}
.flower--1 .flower__line__leaf--3 {
  animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
}
.flower--1 .flower__line__leaf--4 {
  animation: blooming-leaf-left var(--fl-speed) 1s backwards;
}
.flower--1 .flower__line__leaf--5 {
  animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
}
.flower--1 .flower__line__leaf--6 {
  animation: blooming-leaf-left var(--fl-speed) 2s backwards;
}
.flower--2 {
  left: 50%;
  transform: rotate(20deg);
  animation: moving-flower-2 4s linear infinite;
}
.flower--2 .flower__leaf {
  background-color: #ff8a95;
  background-image: linear-gradient(to top, #e84393, #ffb8c6);
}
.flower--2 .flower__line {
  height: 60vmin;
  animation-delay: 0.6s;
}
.flower--2 .flower__line__leaf--1 {
  animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
}
.flower--2 .flower__line__leaf--2 {
  animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
}
.flower--2 .flower__line__leaf--3 {
  animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
}
.flower--2 .flower__line__leaf--4 {
  animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
}
.flower--3 {
  left: 50%;
  transform: rotate(-15deg);
  animation: moving-flower-3 4s linear infinite;
}
.flower--3 .flower__leaf {
  background-color: #ff7043;

}
.flower--3 .flower__line {
  animation-delay: 0.9s;
}
.flower--3 .flower__line__leaf--1 {
  animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
}
.flower--3 .flower__line__leaf--2 {
  animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
}
.flower--3 .flower__line__leaf--3 {
  animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
}
.flower--3 .flower__line__leaf--4 {
  animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
}
.flower__leafs {

  animation: blooming-flower 2s backwards;
}
.flower__leafs--1 {
  animation-delay: 1.1s;
}
.flower__leafs--2 {
  animation-delay: 1.4s;
}
.flower__leafs--3 {
  animation-delay: 1.7s;
}
.flower__leafs::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  transform: translate(-50%, -100%);
  width: 8vmin;
  height: 8vmin;

}
.flower__leaf {

  height: 11vmin;

  box-shadow: inset 0 0 2vmin rgba(255, 255, 255, 0.5);
}
.flower__leaf--1 {
  transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg);
}
.flower__leaf--2 {
  transform: translate(-50%, -4%) rotateX(40deg);
}
.flower__leaf--3 {
  transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg);
}
.flower__leaf--4 {
  width: 8vmin;
  height: 8vmin;
  transform-origin: bottom left;
  border-radius: 4vmin 10vmin 4vmin 4vmin;
  transform: translate(-0%, 18%) rotateX(70deg) rotate(-43deg);

  z-index: 1;

}
.flower__white-circle {
  position: absolute;
  left: -3.5vmin;
  top: -3vmin;

  height: 4vmin;

}

  content: "";
  position: absolute;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);

  height: 60%;

}
.flower__line {
  height: 55vmin;
  width: 1.5vmin;
  background-image: linear-gradient(to left, rgba(0, 0, 0, 0.2), transparent, rgba(255, 255, 255, 0.2)), linear-gradient(to top, transparent 10%, #2e7d32, #43a047);
  box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
  animation: grow-flower-tree 4s backwards;

.flower__line__leaf {

  --h: calc(var(--w) + 2vmin);

  top: 20%;

  width: var(--w);
  height: var(--h);

}
.flower__line__leaf--2 {

}
.flower__line__leaf--3, .flower__line__leaf--4, .flower__line__leaf--6 {
  border-top-right-radius: 0;
  border-bottom-left-radius: 0;
  border-top-left-radius: var(--h);
  border-bottom-right-radius: var(--h);

}
.flower__line__leaf--4 {

}
.flower__line__leaf--5 {
  top: 0;

.flower__line__leaf--6 {

.flower__light {

}
.flower__light:nth-child(odd) {

}
.flower__light--1 {
  left: -2vmin;

}
.flower__light--2 {
  left: 3vmin;

}
.flower__light--3 {

}
.flower__light--4 {

.flower__light--5 {

.flower__grass {

}
.flower__grass--1 {

}
.flower__grass--2 {

  z-index: 0;

}
.flower__grass--top {
  width: 7vmin;
  height: 10vmin;

}

.flower__grass__leaf {

}
.flower__g-long {

/* ===== Watering scene (manual/interactive) ===== */
.watering-scene {
  position: fixed;
  top: 4vmin;
  left: 50%;
  transform: translateX(-50%);
  z-index: 500;
  width: 44vmin;
  height: 32vmin;
  text-align: center;
  transition: opacity 0.4s ease;
}

.can-shadow {
  position: absolute;
  left: 50%;
  top: 15vmin;
  width: 11vmin;
  height: 2.6vmin;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.4), transparent 72%);
  border-radius: 50%;
  animation: shadow-pulse 1.4s ease-in-out infinite;
}

@keyframes shadow-pulse {
  0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.55; }
  50% { transform: translateX(-50%) scale(0.82); opacity: 0.38; }
}

.watering-can {
  position: absolute;
  left: 50%;
  top: 0;
  width: 16vmin;
  height: 12.4vmin;
  cursor: pointer;
  transform-origin: 55% 42%;
  transform: translateX(-50%);
  filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.3));
  animation: can-bob 1.4s ease-in-out infinite;
  transition: filter 0.2s ease;
}

.watering-can:hover {
  filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.35)) brightness(1.06);
}

@keyframes can-bob {
  0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  50% { transform: translateX(-50%) translateY(-1.4vmin) rotate(-2deg); }
}

.watering-scene.active .watering-can {
  cursor: default;
  animation: can-pour 1.3s ease-in-out forwards;
}

@keyframes can-pour {
  0% { transform: translateX(-50%) rotate(0deg); }
  30% { transform: translateX(-50%) rotate(-34deg); }
  80% { transform: translateX(-50%) rotate(-34deg); }
  100% { transform: translateX(-50%) rotate(-28deg); }
}

.watering-scene.active .can-shadow {
  animation: shadow-pulse-active 1.3s ease-in-out forwards;
}

@keyframes shadow-pulse-active {
  0%, 100% { transform: translateX(-50%) scale(0.95); opacity: 0.45; }
}

.watering-hint {
  position: absolute;
  top: 17vmin;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  color: #fff;
  background: rgba(46, 125, 50, 0.9);
  padding: 0.8vmin 2vmin;
  border-radius: 3vmin;
  font: 600 2.1vmin/1.4 system-ui, sans-serif;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
  animation: hint-pulse 1.4s ease-in-out infinite;
}

@keyframes hint-pulse {
  0%, 100% { opacity: 0.85; transform: translateX(-50%) scale(1); }
  50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
}

.watering-scene.active .watering-hint {
  animation: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.watering-scene .drop {
  position: absolute;
  top: 9.5vmin;
  left: 63%;
  width: 1vmin;
  height: 1.5vmin;
  background: #4fc3f7;
  border-radius: 0 50% 50% 50%;
  transform: translateX(-50%) rotate(45deg);
  opacity: 0;
}

.watering-scene .drop.fall {
  animation: drop-fall 0.8s ease-in forwards;
}

.watering-scene .d1.fall { margin-left: -2.5vmin; }
.watering-scene .d2.fall { margin-left: 0.5vmin; }
.watering-scene .d3.fall { margin-left: 3vmin; }
.watering-scene .d4.fall { margin-left: -0.5vmin; }
.watering-scene .d5.fall { margin-left: 2vmin; }

@keyframes drop-fall {
  0% { opacity: 1; transform: translateX(-50%) translateY(0) rotate(45deg); }
  85% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(20vmin) rotate(45deg); }
}

.watering-scene.fade-out {
  opacity: 0;
  pointer-events: none;
}

/* ===== Restart button ===== */
.restart-btn {
  position: fixed;
  top: 3vmin;
  right: 3vmin;
  z-index: 700;
  display: flex;
  align-items: center;
  gap: 1vmin;
  padding: 1.2vmin 2.6vmin;
  border: none;
  border-radius: 999px;
  background: linear-gradient(180deg, #66bb6a, #388e3c);
  color: #fff;
  font: 700 2vmin/1 system-ui, sans-serif;
  cursor: pointer;
  box-shadow: 0 4px 0 #1b5e20, 0 6px 10px rgba(0, 0, 0, 0.3);
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

.restart-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #1b5e20, 0 2px 6px rgba(0, 0, 0, 0.3);
}

/* ===== Falling petals (plays once the not-loaded pause is lifted) ===== */
.petals {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 60;
}

.petal {
  position: absolute;
  top: -6vmin;
  width: 1.6vmin;
  height: 2vmin;
  border-radius: 50% 0 50% 50%;
  opacity: 0;
  animation-name: petal-fall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.petal.c1 { background: #ff6b6b; }
.petal.c2 { background: #ff8a95; }
.petal.c3 { background: #ff7043; }

@keyframes petal-fall {
  0% { opacity: 0; transform: translate(0, 0) rotate(0deg); }
  8% { opacity: 0.95; }
  50% { transform: translate(3vmin, 60vmin) rotate(180deg); }
  92% { opacity: 0.95; }
  100% { opacity: 0; transform: translate(-3vmin, 122vmin) rotate(360deg); }
}

</style>
</head>

  <script>
    const scene = document.getElementById("wateringScene");
    const can = document.getElementById("wateringCan");
    const restartBtn = document.getElementById("restartBtn");
    const drops = ["drop1", "drop2", "drop3", "drop4", "drop5"].map(id => document.getElementById(id));
    let watering = false;

    function waterPlant() {
      if (watering || scene.classList.contains("active")) return;
      watering = true;
      scene.classList.add("active");

      const delays = [900, 1050, 1200, 1350, 1500];
      drops.forEach((d, i) => {
        setTimeout(() => d.classList.add("fall"), delays[i]);
      });

      setTimeout(() => {
        document.body.classList.remove("not-loaded");
      }, 2100);

      setTimeout(() => {
        scene.classList.add("fade-out");
      }, 2500);
    }

    function resetGame() {
      // put everything back to the pre-watering state
      document.body.classList.add("not-loaded");
      scene.classList.remove("active", "fade-out");
      drops.forEach(d => d.classList.remove("fall"));
      watering = false;

      // force every flower/grass animation to restart from frame 0
      const flowersRoot = document.getElementById("flowersRoot");
      flowersRoot.parentNode.replaceChild(flowersRoot.cloneNode(true), flowersRoot);

      // force the falling petals to restart cleanly too
      const petals = document.getElementById("petals");
      petals.parentNode.replaceChild(petals.cloneNode(true), petals);
    }

    can.addEventListener("click", waterPlant);
    can.addEventListener("touchstart", (e) => {
      e.preventDefault();
      waterPlant();
    }, { passive: false });

    restartBtn.addEventListener("click", resetGame);
  </script>
